# farol for a Python service (FastAPI, Flask, Django, MCP, Celery, Temporal, Prefect). Shadow mode: it comments, it
# never blocks.
#
#   tests        your tests, ruff and pip-audit. Runs the PR's code: no secrets, read-only token. Already have a test
#                job? Keep it, and add its "Keep the reports for farol" step.
#   farol-usage  optional, Datadog traffic and errors (set the repository variable FAROL_DATADOG to true and the
#                DD_API_KEY / DD_APP_KEY secrets). Has the keys, runs no code of the PR. One Datadog read per day.
#   farol        reads git and the reports, writes the HTML report and comments on the PR. Never runs the PR's code.
#
# Every push to a pull request that is ready for review posts a new comment: a link that opens the HTML report in the
# browser, and after a push a second report with only the commits since the previous push.
# Pin winnin/farol/action to a commit (`@<sha> # main as of <date>`) once it works for you.
name: farol

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions: {}

concurrency:
  group: farol-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  tests:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - uses: astral-sh/setup-uv@v6

      - run: uv sync --all-extras

      - name: Tests with coverage
        run: |
          mkdir -p reports
          uv run --with pytest-cov pytest --cov=src --cov-report=json:reports/coverage.json

      - name: ruff (with the flake8-bandit S rules for security findings, outside tests)
        if: ${{ !cancelled() }}
        continue-on-error: true
        run: uvx ruff check --output-format json --extend-select S --extend-ignore S101 --exit-zero . > reports/ruff.json

      - name: pip-audit
        if: ${{ !cancelled() }}
        continue-on-error: true
        run: uv run --with pip-audit pip-audit --skip-editable --format json -o reports/pip-audit.json || true

      # A failing test run still has a coverage report: farol shows it either way.
      - name: Keep the reports for farol
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: farol-reports-${{ github.run_id }}
          path: reports/
          if-no-files-found: ignore

  farol-usage:
    if: github.event.pull_request.draft == false && vars.FAROL_DATADOG == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Day of the cache
        id: day
        run: echo "day=$(date -u +%Y-%m-%d)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        id: cache
        with:
          path: farol-usage/usage.json
          key: farol-usage-${{ steps.day.outputs.day }}-${{ hashFiles('farol.config.json') }}
      - uses: actions/setup-node@v4
        if: steps.cache.outputs.cache-hit != 'true'
        with:
          node-version: 22
      - name: farol usage
        if: steps.cache.outputs.cache-hit != 'true'
        uses: winnin/farol/action@main
        with:
          command: usage
          out: farol-usage/usage.json
        env:
          DD_API_KEY: ${{ secrets.DD_API_KEY }}
          DD_APP_KEY: ${{ secrets.DD_APP_KEY }}
      - uses: actions/upload-artifact@v4
        with:
          name: farol-usage-${{ github.run_id }}
          path: farol-usage/usage.json

  farol:
    needs: [tests, farol-usage]
    # After the tests whatever their result, never on drafts.
    if: ${{ !cancelled() && github.event.pull_request.draft == false }}
    runs-on: ubuntu-latest
    # Shadow mode: nothing here can fail CI or block the pull request.
    continue-on-error: true
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          # The base, the merge-base and the history (suggested reviewers) must be available.
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Helper outputs are cached by git tree: the base of every pull request is read once.
      - uses: actions/cache@v4
        with:
          path: ~/.cache/farol
          key: farol-helper-${{ runner.os }}-${{ github.event.pull_request.base.sha }}
          restore-keys: farol-helper-${{ runner.os }}-

      - name: Reports of the other jobs
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          pattern: '{farol-reports,farol-usage}-${{ github.run_id }}'
          path: reports
          merge-multiple: true

      # After a push, also the commits since the previous head of the pull request.
      - name: Previous push
        id: since
        env:
          ACTION: ${{ github.event.action }}
          BEFORE: ${{ github.event.before }}
        run: |
          since=""
          if [ "$ACTION" = "synchronize" ] && [ -n "$BEFORE" ] && git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then since="$BEFORE"; fi
          echo "sha=$since" >> "$GITHUB_OUTPUT"

      - name: farol analyze
        uses: winnin/farol/action@main
        with:
          command: analyze
          base: ${{ github.event.pull_request.base.sha }}
          head: ${{ github.event.pull_request.head.sha }}
          coverage: ${{ hashFiles('reports/coverage.json') != '' && 'reports/coverage.json' || '' }}
          eslint: ${{ hashFiles('reports/ruff.json') != '' && 'reports/ruff.json' || '' }}
          audit: ${{ hashFiles('reports/pip-audit.json') != '' && 'reports/pip-audit.json' || '' }}
          usage: ${{ hashFiles('reports/usage.json') != '' && 'reports/usage.json' || '' }}
          out: farol.json

      - name: farol analyze (since the last push)
        if: steps.since.outputs.sha != ''
        uses: winnin/farol/action@main
        with:
          command: analyze
          base: ${{ github.event.pull_request.base.sha }}
          head: ${{ github.event.pull_request.head.sha }}
          since: ${{ steps.since.outputs.sha }}
          coverage: ${{ hashFiles('reports/coverage.json') != '' && 'reports/coverage.json' || '' }}
          eslint: ${{ hashFiles('reports/ruff.json') != '' && 'reports/ruff.json' || '' }}
          audit: ${{ hashFiles('reports/pip-audit.json') != '' && 'reports/pip-audit.json' || '' }}
          out: farol-since.json

      - name: farol reviewers
        uses: winnin/farol/action@main
        continue-on-error: true
        with:
          command: reviewers
          in: farol.json
          reviewers-file: reviewers.json

      - name: farol html
        uses: winnin/farol/action@main
        with:
          command: html
          in: farol.json
          html-out: farol.html
          reviewers-file: ${{ hashFiles('reviewers.json') != '' && 'reviewers.json' || '' }}

      - name: farol html (since the last push)
        if: steps.since.outputs.sha != ''
        uses: winnin/farol/action@main
        with:
          command: html
          in: farol-since.json
          html-out: farol-since.html

      # Single, non-zipped files: the link in the comment opens the report in the browser.
      - uses: actions/upload-artifact@v7
        id: upload
        with:
          path: farol.html
          archive: false

      - uses: actions/upload-artifact@v7
        id: upload-since
        if: steps.since.outputs.sha != ''
        with:
          path: farol-since.html
          archive: false

      # Pull requests from forks get a read-only token: no comment there (the reports stay in the run's artifacts).
      - name: farol comment
        if: github.event.pull_request.head.repo.full_name == github.repository
        uses: winnin/farol/action@main
        with:
          command: comment
          in: farol.json
          pr: ${{ github.event.pull_request.number }}
          new-comment: 'true'
          report-url: ${{ steps.upload.outputs.artifact-url }}
          since-in: ${{ steps.since.outputs.sha != '' && 'farol-since.json' || '' }}
          since-report-url: ${{ steps.upload-since.outputs.artifact-url }}
          reviewers-file: ${{ hashFiles('reviewers.json') != '' && 'reviewers.json' || '' }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
